[package]
name = "diorama_templo"
version = "0.1.0"
edition = "2021"
default-run = "diorama_templo"

[dependencies]
raylib = "5.0"

# el raytracing hace mucha cuenta por pixel: incluso en modo debug
# compilamos con optimizaciones para que se pueda usar
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
